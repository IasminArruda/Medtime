<div class="nav">
  <div class="logo">
    <img src="assets/img/Logo.png" alt="logo">
  </div>

    <h3 (click)="irParaSobreNos()">Sobre Nós</h3>
    <h3 (click)="irParaCuriosidades()">Curiosidades</h3>

  <form>
    <i class="fas fa-search"></i>
    <input type="text" class="input" placeholder="Procurando alguma coisa?">
  </form>

  <div class="user">
    <i class="fas fa-user-circle" (click)="irParaLogin()"></i>
  </div>
</div>

<!-- Carrossel -->
<div class="carrossel" (mouseenter)="pauseSlide()" (mouseleave)="startAutoSlide()">

  <div class="carrossel-images" [style.transform]="'translateX(' + (-currentIndex * 100) + '%)'">

    <img *ngFor="let img of images" [src]="img" alt="Img">
  </div>

  <button class="prev" (click)="moveSlide(-1)">&#10094;</button>
  <button class="next" (click)="moveSlide(1)">&#10095;</button>
</div>

<!-- Perguntas -->
<div class="perguntas-container" *ngIf="perguntasHome && perguntasHome.length">
  <details class="faq" *ngFor="let f of perguntasHome">
    <summary>{{ f.q }}</summary>
    <p>{{ f.a }}</p>
  </details>
</div>

<!-- Carrossel de Marcas -->
<div class="logo-carousel">
  <div class="logo-track" id="logoTrack">
    <div class="logo-item" *ngFor="let l of trackLogos; let i = index"><img [src]="l" [alt]="'Logo ' + (i+1)" /></div>
  </div>
</div>

<footer class="footer">
  <div class="footer-content">
    <div class="social-icons">
      <a href="https://instagram.com/medtime.3" target="_blank" class="icon"><i class="fab fa-instagram"></i></a>
      <a href="https://facebook.com" target="_blank" class="icon"><i class="fab fa-facebook-f"></i></a>
      <a href="https://twitter.com" target="_blank" class="icon"><i class="fab fa-twitter"></i></a>
      <a href="https://linkedin.com" target="_blank" class="icon"><i class="fab fa-linkedin"></i></a>
    </div>
  </div>
</footer>
